repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: Backend tests (pytest, no network)
        entry: bash -c 'source venv/bin/activate 2>/dev/null; python -m pytest -q --tb=short -m "not network and not slow" || exit 1'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: oxlint
        name: Frontend lint (oxlint)
        entry: bash -c 'cd frontend && npm run lint || exit 1'
        language: system
        pass_filenames: false
        stages: [pre-push]
